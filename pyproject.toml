[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-usage-indicator"
version = "0.2.1"
description = "Windows system tray indicator for Codex rate-limit usage and additional credit balances"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "Pillow>=11,<13",
  "PyInstaller>=6.15,<7",
  "pytest>=8,<10",
]

[project.scripts]
codex-usage-indicator = "codex_usage_indicator.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
